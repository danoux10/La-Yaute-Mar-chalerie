<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Galerie — La Yaute</title>
    <!-- Styles séparés : une seule présentation s'applique selon la largeur. -->
    <link rel="stylesheet" href="style-mobile.css" media="(width < 900px)">
    <link rel="stylesheet" href="style-laptop.css" media="(min-width: 900px)">
    <script src="script.js" defer>
    </script>
  </head>
  <body>
    <!-- Début du bloc Galerie : à reprendre dans votre page. -->
    <main class="section gallery">
      <p class="eyebrow">Galerie</p>
      <h1>La maréchalerie <span>en images</span>
      </h1>
      <p>Un aperçu des gestes du métier et des équidés au cœur de nos paysages alpins.</p>
      <div class="gallery-grid">
        <figure>
          <img class="" src="../assets/images/Parage · travail sur un sabot.png" alt="Travail de parage" loading="lazy">
          <span class="number" aria-hidden="true">01</span>
          <figcaption>
            <h2>Le parage</h2>
            <p>Savoir-faire & précision</p>
          </figcaption>
        </figure>
        <figure>
          <img class="" src="../assets/images/Cheval · paysage alpin.png" alt="Cheval dans les Alpes" loading="lazy">
          <span class="number" aria-hidden="true">02</span>
          <figcaption>
            <h2>Chevaux</h2>
            <p>Soins adaptés à chaque pied</p>
          </figcaption>
        </figure>
        <figure>
          <img class="" src="../assets/images/Âne · paysage alpin.png" alt="Âne dans les Alpes" loading="lazy">
          <span class="number" aria-hidden="true">03</span>
          <figcaption>
            <h2>Ânes</h2>
            <p>Attention et patience</p>
          </figcaption>
        </figure>
        <figure>
          <img class="" src="../assets/images/Mulet · paysage alpin.png" alt="Mulet dans les Alpes" loading="lazy">
          <span class="number" aria-hidden="true">04</span>
          <figcaption>
            <h2>Mulets</h2>
            <p>Respect de chaque équidé</p>
          </figcaption>
        </figure>
      </div>
      <p class="illustration">Visuels d’illustration</p>
    </main>
    <!-- Fin du bloc. -->
  </body>
</html>
