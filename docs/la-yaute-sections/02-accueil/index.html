<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Accueil — La Yaute</title>
    <!-- Styles séparés : une seule présentation s'applique selon la largeur. -->
