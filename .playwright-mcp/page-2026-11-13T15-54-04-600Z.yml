          - paragraph [ref=f7e169]: Je m’appelle Cindy Piccot Ladrey, maréchale-ferrante titulaire d’un CAP maréchal-ferrant, obtenu après quatre années de formation en apprentissage au lycée agricole de Contamine-sur-Arve.
